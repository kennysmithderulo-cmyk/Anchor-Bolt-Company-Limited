    <!-- Canonical + Open Graph URL follow whichever domain the site is served on, so
         attaching a custom domain needs no code change. No production domain is
         hardcoded here on purpose: the client's domain has not been chosen yet, and a
         hardcoded canonical pointing at the preview host would be actively harmful. -->
    <script>
      (function () {
        if (!/^https?:$/.test(location.protocol)) return;
        var canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = location.origin + location.pathname;
        document.head.appendChild(canonical);
        var ogUrl = document.createElement('meta');
        ogUrl.setAttribute('property', 'og:url');
        ogUrl.content = location.origin + location.pathname;
        document.head.appendChild(ogUrl);
      })();
    </script>

    <!-- Keep Greta's own preview hostnames out of search.
         =========================================================
         Every app built with Greta is reachable at a Greta-owned hostname
         (static-<uuid>.greta.sh, and the preview-/gretac- variants) whether or
         not the customer has attached a custom domain. Those hostnames are
         subdomains of greta.sh, so anything indexed there lands in greta.sh's
         own Search Console property — measured 16 Aug 2026: 14 static-* URLs
         indexed by Google, one of them a customer's /admin page, plus 4 hosts
         discovered by Bing. Every one is this shell: HTTP 200, title
         "Greta App", ~2 words of server-rendered text. They rank for nothing
         and dilute the brand domain with identically-titled near-empty pages.

         preview-* and gretac-* already return `X-Robots-Tag: noindex, follow`
         from the edge; static-* was simply missed. This is the same rule
         expressed in the only layer this repo controls — the built artifact is
         static files on GCS, so there is no server here to set a header.

         Scoped by hostname on purpose. On a customer's own domain the test
         fails and nothing is injected, so attaching a custom domain gives a
         fully indexable site exactly as before. robots.txt is deliberately NOT
         used: it is the same file on both hostnames, so disallowing there would
         also block the customer's real domain.

         `follow` is kept so links out of the app still pass equity.

         PREFERRED FIX: set `X-Robots-Tag: noindex, follow` on the
         static-*.greta.sh host at the CDN/load balancer, matching preview-*.
         That is host mapping configured outside this repo. A header does not
         depend on the crawler executing JavaScript, which this does. -->
    <script>
      (function () {
        if (/^(?:static|preview|gretac)-[0-9a-f-]{8,}\.greta\.sh$/i.test(location.hostname)) {
          var m = document.createElement('meta');
          m.name = 'robots';
          m.content = 'noindex, follow';
          document.head.appendChild(m);
        }
      })();
    </script>
